name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          agent-review-comment-slicer \
            --input examples/review-comments.jsonl \
            --config examples/slicer.config.json \
            --out reports \
            --formats markdown,json,junit \
            --no-fail
          test -f reports/review-plan.md
          test -f reports/review-plan.json
          test -f reports/junit.xml
